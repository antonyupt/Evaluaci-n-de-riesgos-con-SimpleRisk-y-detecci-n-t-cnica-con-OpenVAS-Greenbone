# SI-084 · Auditoría de Sistemas · Entorno auditable si084-lab
# Semanas 01-02 (entorno base) + Semana 03 (SimpleRisk)
#
# ALCANCE DE AUDITORÍA: todos los servicios viven en la red audit_net.
# Los puertos se publican SOLO en 127.0.0.1, nunca en 0.0.0.0.
# Las aplicaciones deliberadamente vulnerables (Juice Shop, DVWA) son los
# objetos de auditoría del curso y no deben exponerse fuera de este equipo.

networks:
  audit_net:
    name: audit_net
    driver: bridge

services:

  # --- ACTIVO: Base de datos ERP · Restringida · no expuesta · criticidad 5 ---
  si084_db:
    image: postgres:13
    container_name: si084_db
    environment:
      POSTGRES_PASSWORD: postgres        # credencial por defecto (hallazgo esperado)
      POSTGRES_USER: postgres
      POSTGRES_DB: erp
      POSTGRES_HOST_AUTH_METHOD: md5     # md5 en vez de scram-sha-256 (hallazgo esperado)
    command: >
      postgres
      -c ssl=off
      -c password_encryption=md5
      -c listen_addresses=*
      -c log_statement=none
    networks: [audit_net]
    restart: unless-stopped

  # --- ACTIVO: Portal de clientes · Confidencial · expuesto · criticidad 4 ---
  si084_juiceshop:
    image: bkimminich/juice-shop
    container_name: si084_juiceshop
    ports:
      - "127.0.0.1:3000:3000"
    networks: [audit_net]
    restart: unless-stopped

  # --- ACTIVO: App legada interna · Interna · no expuesta · criticidad 3 ---
  si084_dvwa:
    image: vulnerables/web-dvwa
    container_name: si084_dvwa
    ports:
      - "127.0.0.1:8081:80"
    networks: [audit_net]
    restart: unless-stopped

  # --- ACTIVO: Portal corporativo · Pública · expuesto · criticidad 2 ---
  si084_portal:
    image: nginx:1.18-alpine
    container_name: si084_portal
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./portal/html:/usr/share/nginx/html:ro
      - ./portal/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [audit_net]
    restart: unless-stopped

  # --- HERRAMIENTA: SimpleRisk (Semana 03) ---
  simplerisk-db:
    image: mariadb:11
    container_name: si084_srdb
    environment:
      MARIADB_ROOT_PASSWORD: SimpleRisk_lab
      MARIADB_DATABASE: simplerisk
    volumes:
      - simplerisk_data:/var/lib/mysql
    networks: [audit_net]
    restart: unless-stopped

  simplerisk:
    image: simplerisk/simplerisk:latest
    container_name: si084_simplerisk
    depends_on: [simplerisk-db]
    ports:
      - "127.0.0.1:8083:80"
      - "127.0.0.1:8443:443"    # SimpleRisk redirige a HTTPS
    networks: [audit_net]
    restart: unless-stopped

volumes:
  simplerisk_data:
