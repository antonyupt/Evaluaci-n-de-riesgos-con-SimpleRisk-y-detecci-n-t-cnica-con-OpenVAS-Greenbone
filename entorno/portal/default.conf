server {
    listen 80;
    server_name si084_portal;
    root /usr/share/nginx/html;
    index index.html;

    # Configuración por defecto no endurecida (hallazgo esperado):
    # listado de directorios habilitado y sin cabeceras de seguridad.
    location /docs/ {
        autoindex on;
    }
    location /status {
        stub_status on;
    }
}
